name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install & verify
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          PYTHONPATH=. python -m unittest discover -s tests -v
          PYTHONPATH=. python -m sifreleme_araci self-check

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## Basit Şifreleme Aracı ${{ github.ref_name }}

            AES-256-GCM + Scrypt dosya/metin şifreleme CLI.

            ```bash
            pip install -r requirements.txt
            PYTHONPATH=. python -m sifreleme_araci self-check
            ```

            Teknik kararlar: `report.md`
